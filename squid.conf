http_port 3128
cache_effective_user proxy

acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8

acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

acl allowed_openai dstdomain .openai.com
acl allowed_chatgpt dstdomain .chatgpt.com
acl allowed_npm dstdomain .npmjs.org
acl allowed_anthropic dstdomain .anthropic.com
acl allowed_claude_com dstdomain .claude.com
acl allowed_claude dstdomain .claude.ai
acl allowed_sentry dstdomain .sentry.io

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet CONNECT allowed_openai
http_access allow localnet CONNECT allowed_chatgpt
http_access allow localnet CONNECT allowed_npm
http_access allow localnet CONNECT allowed_anthropic
http_access allow localnet CONNECT allowed_claude_com
http_access allow localnet CONNECT allowed_claude
http_access allow localnet CONNECT allowed_sentry
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
via off
forwarded_for delete

set -g default-shell /bin/bash
# Start non-login Bash so login profiles don't reset the inherited toolchain PATH.
set -g default-command 'exec /bin/bash'

set -s extended-keys on
set -s extended-keys-format csi-u

set -g prefix C-b
bind C-b send-prefix

# Enable mouse support for pane/window switching and resizing
set -g mouse on

# Use | and - to split panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle between the two last active windows
bind L last-window

# Uncomment for Vim-style copy mode
# set -g mode-keys vi

set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100
set -g status-left '#S'
set -g status-right '#(whoami)@#H %Y-%m-%d %H:%M'

set -g history-limit 10000

# Copy tmux selections to the outer terminal using OSC 52.
# If nested inside host tmux, set set-clipboard on in the HOST config.
set -as terminal-features ',tmux*:clipboard'
set -s set-clipboard external
